# ImageTrainer environment (supervised label prediction)
environment = image-trainer

# Number of classes (labels): observations and valid actions are in [0, classes-1]
image-classes = 4

# Optional: stop after N steps (0 = never). Consider using terminate-age too.
image-max-steps = 0

# Typical agent settings
exploration = 0.1
explore-decay = 0.999
agent-horizon = 8
ct-depth = 16
mc-simulations = 100
verbose = true
learning-period = 5000
terminate-age = 2000

