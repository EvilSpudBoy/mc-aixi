[project]
name = "mcp-lmstudio"
version = "0.1.0"
description = "MCP server for LM Studio (OpenAI-compatible local LLM API)"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli] >= 1.2.0",
  "httpx >= 0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

